[project]
name = "stock-market-pipeline"
version = "1.0.0"
description = "Dockerized Airflow pipeline for fetching Alpha Vantage stock data into PostgreSQL"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:asyncio"
markers = [
    "integration: marks tests that need a live database (deselect with '-m \"not integration\"')",
]
